<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      width: 100%;
      height: 100%;
      background-color: #f5f7fa; 
      overflow: auto; 
    }
    
    /* Layout da tela de Login */
    .login-container {
      display: flex; 
      justify-content: center; 
      align-items: center; 
      width: 100%;
      height: 100vh; 
      padding: 20px;
    }
    .card { 
      background: white; 
      padding: 35px 30px; 
      border-radius: 8px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
      width: 100%;
      max-width: 360px; 
      text-align: center; 
    }
    h2 { color: #1e293b; margin-bottom: 24px; font-size: 22px; font-weight: 600; }
    
    /* Estilos de Inputs compartilhados (Login e Formulário) */
    input[type="text"], input[type="password"], textarea, select { 
      width: 100%; 
      padding: 12px 14px; 
      margin: 8px 0 16px 0; 
      border: 1px solid #cbd5e1; 
      border-radius: 6px; 
      font-size: 14px; 
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus {
      border-color: #1a73e8;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    label {
      display: block;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      margin-bottom: -4px;
    }

    /* Botões */
    button { 
      width: 100%; 
      padding: 12px; 
      background-color: #1a73e8; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 15px; 
      font-weight: 600; 
      margin-top: 12px; 
      transition: background-color 0.2s;
    }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    
    #message, #formMessage { margin-top: 12px; font-size: 13px; min-height: 18px; font-weight: 500; }
    
    /* Layout fluido pós-login (Formulário) */
    .dashboard-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1e293b;
      color: white;
      padding: 0 20px;
      height: 56px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .header-bar h3 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: 0.5px; }
    .btn-logout {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      width: auto;
      margin-top: 0;
    }
    .btn-logout:hover { background-color: #dc2626; }
    
    /* Container centralizado para o Formulário */
    .form-wrapper {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    .form-card {
      background: white; 
      padding: 40px; 
      border-radius: 8px; 
      box-shadow: 0 4px 16px rgba(0,0,0,0.05); 
      width: 100%;
      max-width: 600px; /* Mais largo que o login para acomodar bem as perguntas */
    }
    .form-card h2 { text-align: left; margin-bottom: 30px; color: #0f172a; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. TELA DE LOGIN -->
  <div class="login-container" id="loginPage">
    <div class="card">
      <h3>Plataforma de Dados</h3>
      <br>
      <h2>Acesso Restrito</h2>
      <input type="text" id="username" placeholder="Usuário" autocomplete="off">
      <input type="password" id="password" placeholder="Senha">
      <button onclick="login()">Entrar</button>
      <div id="message"></div>
    </div>
  </div>

  <!-- 2. TELA LOGADA DO FORMULÁRIO -->
  <div class="dashboard-container hidden" id="dashboardPage">
    <div class="header-bar">
      <h3>Área Logada - Ingestão de Dados</h3>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
    
    <div class="form-wrapper">
      <div class="form-card">
        <h2>Registro de Informações</h2>
        
        <label for="formNome">Nome Completo</label>
        <input type="text" id="formNome" placeholder="Digite seu nome">

        <label for="formSetor">Setor / Departamento</label>
        <select id="formSetor">
          <option value="" disabled selected>Selecione uma opção...</option>
          <option value="Pesquisa e Desenvolvimento">Pesquisa e Desenvolvimento</option>
          <option value="Ciência de Dados">Ciência de Dados</option>
          <option value="Engenharia">Engenharia</option>
          <option value="Outros">Outros</option>
        </select>

        <label for="formObs">Observações / Feedback</label>
        <textarea id="formObs" placeholder="Insira os detalhes aqui..."></textarea>

        <button onclick="enviarDados()" id="btnSubmit">Enviar Registro</button>
        <div id="formMessage"></div>
      </div>
    </div>
  </div>

  <script>
    // --- FUNÇÃO DE LOGIN ---
    function login() {
      var user = document.getElementById('username').value;
      var pass = document.getElementById('password').value;
      var msg = document.getElementById('message');
      
      if (!user || !pass) {
        msg.innerText = "Por favor, preencha todos os campos.";
        msg.style.color = "#d93025";
        return;
      }
      
      msg.style.color = "#475569";
      msg.innerText = "Autenticando...";
      
      // Chamada ao backend (Code.gs)
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            // Limpa formulário de login por segurança
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
            msg.innerText = "";
            
            // Alterna as telas
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
          } else {
            msg.style.color = "#d93025";
            msg.innerText = response.message;
          }
        })
        .withFailureHandler(function(err) {
          msg.style.color = "#d93025";
          msg.innerText = "Erro ao conectar ao servidor. Tente novamente.";
        })
        .checkLogin(user, pass);
    }

    // --- FUNÇÃO DE LOGOUT ---
    function logout() {
      // Limpa os campos do formulário ao sair
      document.getElementById('formNome').value = "";
      document.getElementById('formSetor').value = "";
      document.getElementById('formObs').value = "";
      document.getElementById('formMessage').innerText = "";

      // Alterna as telas de volta
      document.getElementById('dashboardPage').classList.add('hidden');
      document.getElementById('loginPage').classList.remove('hidden');
      
      const msg = document.getElementById('message');
      msg.style.color = "#1557b0";
      msg.innerText = "Sessão encerrada com sucesso.";
    }

    // --- FUNÇÃO DE ENVIO DO FORMULÁRIO ---
    function enviarDados() {
      const nome = document.getElementById('formNome').value;
      const setor = document.getElementById('formSetor').value;
      const obs = document.getElementById('formObs').value;
      const msg = document.getElementById('formMessage');
      const btn = document.getElementById('btnSubmit');

      // Validação simples
      if (!nome || !setor) {
        msg.style.color = "#d93025";
        msg.innerText = "Por favor, preencha o Nome e o Setor.";
        return;
      }

      // Prepara interface para envio
      msg.style.color = "#475569";
      msg.innerText = "Registrando dados no sistema...";
      btn.disabled = true; // Evita duplo clique

      // Monta o objeto com os dados
      const dadosFormulario = {
        nome: nome,
        setor: setor,
        observacao: obs
      };

      // Chama a função salvarResposta() no Code.gs
      google.script.run
        .withSuccessHandler(function(respostaServidor) {
          msg.style.color = "#16a34a"; // Verde sucesso
          msg.innerText = "Registro salvo com sucesso!";
          
          // Limpa os campos para um novo preenchimento
          document.getElementById('formNome').value = "";
          document.getElementById('formSetor').value = "";
          document.getElementById('formObs').value = "";
          
          btn.disabled = false;
        })
        .withFailureHandler(function(erro) {
          msg.style.color = "#d93025";
          msg.innerText = "Falha ao salvar. Tente novamente.";
          btn.disabled = false;
        })
        .salvarResposta(dadosFormulario);
    }
  </script>
</body>
</html>
